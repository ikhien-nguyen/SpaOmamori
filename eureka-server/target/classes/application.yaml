server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    # Standalone mode: b?n th�n Eureka Server kh�ng t? ??ng k� ch�nh n� v�
    # kh�ng c?n fetch registry t? server kh�c (ch? ch?y 1 instance duy nh?t,
    # ?? d�ng cho ph?m vi ?? �n ? kh�ng c?n cluster nhi?u node).
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

  server:
    # Cau hinh danh cho moi truong dev/demo tren 1 may: eviction interval
    # ngan lai va tat self-preservation de instance "chet" (tat service) duoc
    # go khoi dashboard nhanh hon, thay vi cho toi 90s theo mac dinh cua
    # Eureka (phu hop production nhieu node, khong can thiet khi chi co 1
    # Eureka Server chay local).
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
