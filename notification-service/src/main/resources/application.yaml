server:
  port: 8088
  servlet:
    context-path: /notifications

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:mysql://localhost:3306/omamori_notification
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.spa.notificationservice.dto.event"
        spring.json.value.default.type: com.spa.notificationservice.dto.event.InvoicePaidEvent
        spring.json.use.type.headers: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

notification:
  email:
    enabled: false
    from: ""

notification-kafka:
  invoice-paid-topic: invoice-paid

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  signerKey: "${JWT_SIGNER_KEY:1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij}"
