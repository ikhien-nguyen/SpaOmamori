server:
  port: 8888

app:
  api-prefix: /api/omamori
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173"

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # StripPrefix=2 loại bỏ 2 segment đầu (/api/omamori) trước khi forward,
      # nên downstream service chỉ cần biết context-path của chính nó.
      # uri dùng lb://<spring.application.name của service> (viết hoa/thường đều được)
      # thay vì localhost:port cứng — Gateway tự tra địa chỉ qua Eureka.
      routes:
        - id: user_service
          uri: lb://users
          predicates:
            - Path=${app.api-prefix}/users/**
          filters:
            - StripPrefix=2

        - id: profile_service
          uri: lb://profiles
          predicates:
            - Path=${app.api-prefix}/profiles/**
          filters:
            - StripPrefix=2

        - id: media_service
          uri: lb://media
          predicates:
            - Path=${app.api-prefix}/media/**
          filters:
            - StripPrefix=2

        - id: treatment_service
          uri: lb://treatment-service
          predicates:
            - Path=${app.api-prefix}/treatments/**
          filters:
            - StripPrefix=2

        - id: cosmetic_service
          uri: lb://cosmetics
          predicates:
            - Path=${app.api-prefix}/cosmetics/**
          filters:
            - StripPrefix=2

      # Trả lời rõ ràng thay vì hang khi downstream không phản hồi kịp
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/