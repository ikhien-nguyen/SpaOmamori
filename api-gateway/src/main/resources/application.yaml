server:
  port: 8888

app:
  api-prefix: /api/omamori
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173"

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # StripPrefix=2 lo?i b? 2 segment ??u (/api/omamori) tr??c khi forward,
      # n�n downstream service ch? c?n bi?t context-path c?a ch�nh n�.
      routes:
        - id: user_service
          uri: http://localhost:8080
          predicates:
            - Path=${app.api-prefix}/users/**
          filters:
            - StripPrefix=2

        - id: profile_service
          uri: http://localhost:8081
          predicates:
            - Path=${app.api-prefix}/profiles/**
          filters:
            - StripPrefix=2

      # Tr? l?i r� r�ng thay v� hang khi downstream kh�ng ph?n h?i k?p
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s